services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: fc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_charts
    ports:
      - '8102:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — backing store for backend cache (PR2) + Throttler storage (PR2).
  # AOF persistence enabled to mitigate R1 (Redis SPOF).
  redis:
    image: redis:8-alpine
    container_name: fc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - '8103:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend - NestJS
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: fc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8101
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/financial_charts
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: ${REDIS_REQUIRED:-false}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-fc:}
      # Load JWT_SECRET from the host .env (required: ≥32 chars).
      # If unset, the backend will refuse to start — see auth.module.ts.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env. Generate with openssl rand -hex 32}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8100}
      # External data provider API keys (loaded from .env at project root)
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      IOL_USERNAME: ${IOL_USERNAME:-}
      IOL_PASSWORD: ${IOL_PASSWORD:-}
      IOL_BASE_URL: ${IOL_BASE_URL:-https://api.invertironline.com}
    ports:
      - '8101:8101'
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages/database/prisma:/app/packages/database/prisma

  # Frontend - Next.js
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: fc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8101
      NEXT_PUBLIC_WS_URL: ws://localhost:8101
    ports:
      - '8100:8100'
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/public:/app/apps/frontend/public

  # Prometheus — scrapes the backend /metrics endpoint + redis-exporter + self.
  fc-prometheus:
    image: prom/prometheus:v2.55.0
    container_name: fc-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # In .all.yml we bind to localhost only — production posture is to
      # reverse-proxy or scrape from inside the network. Dev users use
      # `docker-compose.observability.yml` to publish on all interfaces.
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - backend

  # redis-exporter — Prometheus metrics for the Redis cache layer.
  fc-redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: fc-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://fc-redis:6379
    ports:
      - "127.0.0.1:9110:9121"
    depends_on:
      redis:
        condition: service_healthy

  # Grafana — auto-provisions Prometheus datasource + 3 dashboards from
  # the repo-mounted ops/ folder.
  fc-grafana:
    image: grafana/grafana:11.3.0
    container_name: fc-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:8300:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      fc-prometheus:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: fc-network
