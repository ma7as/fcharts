version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_charts
    ports:
      - '8102:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (currently unused — the backend does not wire CacheModule.
  # The DB-level candle cache is sufficient for the current load. Uncomment
  # this block + reintroduce cache-manager deps if/when a real caching layer
  # is needed.)
  # redis:
  #   image: redis:7-alpine
  #   container_name: fc-redis
  #   restart: unless-stopped
  #   ports:
  #     - '8103:6379'
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

  # Backend - NestJS
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: fc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8101
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/financial_charts
      # Load JWT_SECRET from the host .env (required: ≥32 chars).
      # If unset, the backend will refuse to start — see auth.module.ts.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env. Generate with openssl rand -hex 32}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8100}
      # External data provider API keys (loaded from .env at project root)
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      IOL_USERNAME: ${IOL_USERNAME:-}
      IOL_PASSWORD: ${IOL_PASSWORD:-}
      IOL_BASE_URL: ${IOL_BASE_URL:-https://api.invertironline.com}
    ports:
      - '8101:8101'
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages/database/prisma:/app/packages/database/prisma

  # Frontend - Next.js
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: fc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8101
      NEXT_PUBLIC_WS_URL: ws://localhost:8101
    ports:
      - '8100:8100'
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/public:/app/apps/frontend/public

volumes:
  postgres_data:
    driver: local
  # redis_data:
  #   driver: local

networks:
  default:
    name: fc-network
