# Dev overlay for observability: publish Prometheus (9090) + Grafana (8300)
# + redis-exporter (9110) on all interfaces so a developer can hit
# `http://localhost:8300` from the host. Use with:
#
#   docker compose -f docker-compose.all.yml -f docker-compose.observability.yml up
#
# Production posture is `docker-compose.all.yml` alone (ports bound to
# 127.0.0.1; reverse-proxy or scrape from inside the network).

include:
  - path: ./docker-compose.all.yml

services:
  fc-prometheus:
    ports:
      - "9090:9090"

  fc-grafana:
    ports:
      - "8300:3000"

  fc-redis-exporter:
    ports:
      - "9110:9121"
