global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: fcharts-backend

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fcharts-backend
    metrics_path: /internal/metrics
    static_configs:
      - targets: ['fc-backend:8101']

  - job_name: redis-exporter
    static_configs:
      - targets: ['fc-redis-exporter:9121']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
